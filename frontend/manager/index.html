<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCode Docker 管理台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">4098 Manager</p>
          <h1>OpenCode Docker 管理台</h1>
          <p class="subtitle">管理 OpenCode、Codex 渠道与 MCP，并重启托管服务。</p>
        </div>
        <button id="logoutButton" class="ghost hidden" type="button">退出登录</button>
      </section>

      <section id="loginPanel" class="panel narrow">
        <h2>登录</h2>
        <p class="muted">使用 OPENCODE_SERVER_USERNAME / OPENCODE_SERVER_PASSWORD。</p>
        <form id="loginForm" class="stack">
          <label>账号<input name="username" autocomplete="username" required /></label>
          <label>密码<input name="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">登录</button>
        </form>
      </section>

      <section id="appPanel" class="hidden workspace">
        <div class="status-strip">
          <span id="opencodePath"></span>
          <span id="codexPath"></span>
          <span id="codexAuthMode"></span>
        </div>

        <section class="panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Processes</p>
              <h2>托管服务</h2>
            </div>
            <button id="refreshServicesButton" class="ghost" type="button">刷新</button>
          </div>
          <div id="services" class="rows"></div>
        </section>

        <section class="grid">
          <article class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">OpenCode</p>
                <h2>渠道</h2>
              </div>
              <button id="saveOpenCodeModelButton" class="ghost" type="button">保存默认模型</button>
            </div>
            <label>默认模型<input id="opencodeModel" placeholder="provider/model" /></label>
            <div id="opencodeProviders" class="rows"></div>
            <form id="opencodeProviderForm" class="stack editor">
              <h3>新增 / 更新 OpenCode 渠道</h3>
              <label>ID<input name="id" required placeholder="my-provider" /></label>
              <label>名称<input name="name" required placeholder="My Provider" /></label>
              <label>Base URL<input name="baseUrl" required placeholder="https://api.example.com/v1" /></label>
              <label>API Key<input name="apiKey" type="password" placeholder="留空保留原值" /></label>
              <label>NPM 包<input name="npm" value="@ai-sdk/openai-compatible" /></label>
              <label>模型列表<textarea name="models" rows="4" placeholder="gpt-5.5=GPT-5.5\nglm-5.1=GLM 5.1"></textarea></label>
              <label>Headers JSON<textarea name="headers" rows="3" placeholder='{"HTTP-Referer":"https://opencode.ai/"}'></textarea></label>
              <button type="submit">保存 OpenCode 渠道</button>
            </form>
          </article>

          <article class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Codex</p>
                <h2>渠道</h2>
              </div>
              <button id="saveCodexActiveButton" class="ghost" type="button">保存当前渠道</button>
            </div>
            <label>当前 provider<input id="codexProvider" placeholder="proxy" /></label>
            <label>默认模型<input id="codexModel" placeholder="gpt-5.5" /></label>
            <div id="codexProviders" class="rows"></div>
            <form id="codexProviderForm" class="stack editor">
              <h3>新增 / 更新 Codex 渠道</h3>
              <label>ID<input name="id" required placeholder="proxy" /></label>
              <label>名称<input name="name" required placeholder="OpenAI Proxy" /></label>
              <label>Base URL<input name="baseUrl" required placeholder="https://proxy.example.com/v1" /></label>
              <label class="inline"><input name="requiresOpenaiAuth" type="checkbox" /> 使用 Codex OAuth / OpenAI 登录态</label>
              <label>环境变量 Key<input name="envKey" placeholder="OPENAI_API_KEY" /></label>
              <label>Bearer Token<input name="apiKey" type="password" placeholder="留空保留原值；OAuth auth.json 不会改写" /></label>
              <label>Headers JSON<textarea name="headers" rows="3" placeholder='{"X-Trace":"enabled"}'></textarea></label>
              <button type="submit">保存 Codex 渠道</button>
            </form>
          </article>
        </section>

        <section class="grid">
          <article class="panel">
            <p class="eyebrow">OpenCode</p>
            <h2>MCP</h2>
            <div id="opencodeMcp" class="rows"></div>
            <form data-mcp-app="opencode" class="stack editor mcp-form">
              <h3>新增 / 更新 OpenCode MCP</h3>
              <label>ID<input name="id" required placeholder="context7" /></label>
              <label>类型<select name="transport"><option value="stdio">local / stdio</option><option value="http">remote / http</option><option value="sse">remote / sse</option></select></label>
              <label>Command<input name="command" placeholder="npx" /></label>
              <label>Args<textarea name="args" rows="3" placeholder="每行一个参数&#10;-y&#10;@upstash/context7-mcp"></textarea></label>
              <label>CWD<input name="cwd" placeholder="/workspace/project" /></label>
              <label>URL<input name="url" placeholder="https://mcp.example.com/mcp" /></label>
              <label>Env JSON<textarea name="env" rows="3"></textarea></label>
              <label>Headers JSON<textarea name="headers" rows="3"></textarea></label>
              <label class="inline"><input name="enabled" type="checkbox" checked /> 启用</label>
              <button type="submit">保存 MCP</button>
            </form>
          </article>

          <article class="panel">
            <p class="eyebrow">Codex</p>
            <h2>MCP</h2>
            <div id="codexMcp" class="rows"></div>
            <form data-mcp-app="codex" class="stack editor mcp-form">
              <h3>新增 / 更新 Codex MCP</h3>
              <label>ID<input name="id" required placeholder="context7" /></label>
              <label>类型<select name="transport"><option value="stdio">stdio</option><option value="http">http</option></select></label>
              <label>Command<input name="command" placeholder="npx" /></label>
              <label>Args<textarea name="args" rows="3" placeholder="每行一个参数&#10;-y&#10;@upstash/context7-mcp"></textarea></label>
              <label>CWD<input name="cwd" placeholder="/workspace/project" /></label>
              <label>URL<input name="url" placeholder="https://mcp.example.com/mcp" /></label>
              <label>Env JSON<textarea name="env" rows="3"></textarea></label>
              <label>Headers JSON<textarea name="headers" rows="3"></textarea></label>
              <label>Bearer Token Env<input name="bearerTokenEnvVar" placeholder="FIGMA_OAUTH_TOKEN" /></label>
              <label class="inline"><input name="enabled" type="checkbox" checked /> 启用</label>
              <button type="submit">保存 MCP</button>
            </form>
          </article>
        </section>
      </section>
    </main>
    <div id="toast" class="toast hidden"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
