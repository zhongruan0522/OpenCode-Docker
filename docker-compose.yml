services:
  opencode:
    image: ghcr.io/zhongruan0522/opencode-docker:${OPENCODE_SERVER_VERSION:1.14.19}
    container_name: opencode
    ports:
      # Codex登录端口
      - "0.0.0.0:1455:1455"
      # OpenCode端口
      - "127.0.0.1:4096:4096"
      # Code-Serve端口
      - "127.0.0.1:4097:8080"
      # Zread 端口
      - "0.0.0.0:9681:9681"
    environment:
      # OpenCode
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      - OPENCODE_ENABLE_EXA=${OPENCODE_ENABLE_EXA:true}
      # Code-Server
      - CODE_SERVER_PASSWORD=${CODE_SERVER_PASSWORD:-}
      # GitHub
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      # Playwright
      - PLAYWRIGHT_BROWSERS_PATH=/home/app/.cache/ms-playwright
      - PLAYWRIGHT_MCP_HEADLESS=1
      - PLAYWRIGHT_MCP_BROWSER=chromium
      - PLAYWRIGHT_MCP_NO_SANDBOX=1
      # UID/GID
      - LOCAL_UID=${LOCAL_UID:-10001}
      - LOCAL_GID=${LOCAL_GID:-10001}
      # MicroWARP
      - ENABLE_WARP=${ENABLE_WARP:-1}
      - WARP_SOCKS_PORT=${WARP_SOCKS_PORT:-1080}
      - SOCKS_USER=${SOCKS_USER:-}
      - SOCKS_PASS=${SOCKS_PASS:-}
      - ENDPOINT_IP=${ENDPOINT_IP:-}
      - GH_PROXY=${GH_PROXY:-}
      - TAILSCALE_CIDR=${TAILSCALE_CIDR:-}
      - WARP_BYPASS_CIDRS=${WARP_BYPASS_CIDRS:-}
    ulimits:
      core:
        soft: 0
        hard: 0
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      # === 工作区 ===
      - ./workspace:/workspace:rshared
      
      # 主服务
      # === Git 配置 ===
      - ./app-config/.git-credentials:/home/app/.git-credentials:rshared
      - ./app-config/.gitconfig:/home/app/.gitconfig:rshared
      - ./.config/gh:/home/app/.config/gh:rshared
      # === Code-Server ===
      - ./.local/share/code-server:/home/app/.local/share/code-server:rshared
      - ./.config/code-server:/home/app/.config/code-server:rshared
      
      # CLI
      # === OpenCode 配置 ===
      - ./.config/opencode/agents:/home/app/.config/opencode/agents:rshared
      - ./.config/opencode/plugins:/home/app/.config/opencode/plugins:rshared
      - ./.config/opencode/skills:/home/app/.config/opencode/skills:rshared
      - ./.config/opencode/AGENTS.md:/home/app/.config/opencode/AGENTS.md:rshared
      - ./.config/opencode/opencode.json:/home/app/.config/opencode/opencode.json:rshared
      - ./.local/share/opencode:/home/app/.local/share/opencode:rshared
      # === OpenCode 附属依赖 - Serena ===
      - ./.serena:/home/app/.serena:rshared
      # === OpenAI Codex ===
      - ./.codex:/home/app/.codex:rshared
      # === 飞书CLI ===
      - ./.lark-cli:/home/app/.lark-cli:rshared
      - ./.local/share/lark-cli:/home/app/.local/share/lark-cli:rshared

      # 其他
      # === WRAP代理 ===
      - warp-data:/etc/wireguard
      
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - 1panel-network
    restart: unless-stopped

volumes:
  warp-data:

networks:
  1panel-network:
    external: true
