services:
  opencode:
    image: ghcr.io/zhongruan0522/opencode-docker:${OPENCODE_SERVER_VERSION:-1.14.19}
    container_name: opencode
    ports:
      # Codex登录端口
      - "0.0.0.0:1455:1455"
      # OpenCode端口
      - "127.0.0.1:4096:4096"
      # Code-Serve端口
      - "127.0.0.1:4097:8080"
      # SSH 端口
      - "0.0.0.0:2223:2223"
      # SOCKS5 代理端口（MicroWARP，解除注释以对外暴露；内层 Docker 容器通过桥接网关 IP 即可访问，无需暴露）
      # - "127.0.0.1:1080:1080"
      # 远程桌面 (RDP) 端口
      - "127.0.0.1:3390:3390"
    environment:
      # OpenCode
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME} # OpenCode 服务登录用户名，entrypoint 会校验必填
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD} # OpenCode 服务登录密码
      - OPENCODE_ENABLE_EXA=${OPENCODE_ENABLE_EXA:-true} # 是否启用 OpenCode 的 Exa 搜索能力
      # Code-Server
      - CODE_SERVER_PASSWORD=${CODE_SERVER_PASSWORD:-} # code-server 明文登录密码，entrypoint 会注入给 code-server
      - CODE_SERVER_HASHED_PASSWORD=${CODE_SERVER_HASHED_PASSWORD:-} # code-server 哈希密码（优先级高于明文），留空则不启用
      # GitHub
      - GITHUB_TOKEN=${GITHUB_TOKEN} # GitHub CLI 登录 token，用于容器内 gh auth 和 git 操作
      - GITHUB_SSH_KEY=${GITHUB_SSH_KEY:-} # GitHub SSH 私钥（base64 编码），留空则不注入 id_rsa
      # Playwright
      - PLAYWRIGHT_BROWSERS_PATH=/home/app/.cache/ms-playwright # Playwright 浏览器缓存目录，使用 base 镜像预装的 Chromium
      - PLAYWRIGHT_MCP_HEADLESS=1 # Playwright MCP 默认无头模式运行
      - PLAYWRIGHT_MCP_BROWSER=chrome # Playwright MCP 浏览器，chrome=系统 Chrome Stable（日常浏览同一份），chromium=Playwright bundled
      - PLAYWRIGHT_MCP_SANDBOX=0 # 容器内 Chrome 禁用 sandbox，避免权限问题（Playwright 源码只读 SANDBOX，NO_SANDBOX 是死变量）
      # UID/GID
      - LOCAL_UID=${LOCAL_UID:-10001} # 启动时把 app 用户调整为宿主期望 UID，减少挂载文件权限问题
      - LOCAL_GID=${LOCAL_GID:-10001} # 启动时把 app 用户调整为宿主期望 GID
      # MicroWARP
      - ENABLE_WARP=${ENABLE_WARP:-1} # 是否启用 MicroWARP 初始化；关闭后不会注入 SOCKS5_PROXY
      # TUNNEL_PROTOCOL 已注释：默认 wireguard（内核级 SOCKS5 出口），MASQUE 相关见下方注释块
      # - TUNNEL_PROTOCOL=masque # 隧道协议：wireguard（内核，默认）| masque（usque 用户态，抗 UDP QoS/封锁）
      - WARP_SOCKS_PORT=${WARP_SOCKS_PORT:-1080} # MicroWARP SOCKS 端口
      - WARP_SOCKS_BIND=${WARP_SOCKS_BIND:-0.0.0.0} # MicroWARP SOCKS 监听地址（0.0.0.0 对外可见，127.0.0.1 仅容器内）
      - SOCKS_USER=${SOCKS_USER:-} # MicroWARP SOCKS 认证用户名，留空则不启用用户名
      - SOCKS_PASS=${SOCKS_PASS:-} # MicroWARP SOCKS 认证密码，留空则不启用密码
      - ENDPOINT_IP=${ENDPOINT_IP:-} # 指定 WARP endpoint IP，留空由 init-warp 自动选择
      - GH_PROXY=${GH_PROXY:-} # GitHub 访问代理覆盖值，供 init-warp 或相关脚本使用
      - TAILSCALE_CIDR=${TAILSCALE_CIDR:-} # 需要绕过 WARP 的 Tailscale 网段
      - WARP_BYPASS_CIDRS=${WARP_BYPASS_CIDRS:-} # 额外绕过 WARP 的 CIDR 列表
      - MTU=${MTU:-1280} # WireGuard MTU，小 MTU 链路（PPPoE 等）避免分片
      - KEEPALIVE=${KEEPALIVE:-15} # WireGuard PersistentKeepalive 秒数，对抗 NAT/QoS 空闲断流
      - ENABLE_WARP_IPV6=${ENABLE_WARP_IPV6:-0} # 双栈 WARP 出口（IPv4+IPv6），1=启用（需宿主网络支持 IPv6）
      # MicroWARP - MASQUE 协议（默认关闭，默认走 WireGuard SOCKS5 出口；启用方法：解除注释并设 TUNNEL_PROTOCOL=masque）
      # - MASQUE_PROXY_MODE=l4-socks # l4-socks（轻量 TCP-only，推荐）| socks（完整 gVisor L3，TCP+UDP）
      # - MASQUE_HTTP2=0 # 1 = TCP/HTTP2 回退（需 MASQUE_PROXY_MODE=socks）
      # - WARP_JWT= # Zero Trust team token（MASQUE 注册用），留空则普通注册
      # - WARP_LICENSE= # WARP+ license key（尽力绑定，失败不阻断）
      # - GOMEMLIMIT=512MiB # MASQUE 路径 Go 运行时 RSS 软上限
      # 远程桌面 (xrdp + XFCE4)
      - ENABLE_DESKTOP=${ENABLE_DESKTOP:-1} # 是否启用 xrdp 远程桌面，默认启用，端口 3390
      - DESKTOP_PASSWORD=${DESKTOP_PASSWORD:-app} # app 用户 RDP 登录密码（仅 ALLOW_APP_DESKTOP=1 时生效），建议改为强密码
      - DESKTOP_USER_PASSWORD=${DESKTOP_USER_PASSWORD:-} # desktop 用户 RDP 登录密码，留空则复用 DESKTOP_PASSWORD，两者都空则无密码登录
      - ALLOW_APP_DESKTOP=${ALLOW_APP_DESKTOP:-1} # 是否允许 app 用户桌面登录，1=允许（默认，向后兼容），0=禁用（仅 desktop 可登录）
      # DinD
      - ENABLE_DOCKERD=${ENABLE_DOCKERD:-0} # 是否开机自启 DinD dockerd，默认关闭以节省内存。运行中可 supervisorctl start dockerd 手动拉起
    ulimits:
      core:
        soft: 0
        hard: 0
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    # Chrome/Chromium 用 /dev/shm 做进程间共享内存，Docker 默认仅 64MB，
    # 桌面会话中打开浏览器会因 shm 不足触发 EIO（"输入/输出错误"）并频繁崩溃。
    # 提升到 2GB 彻底消除该瓶颈（xdpyinfo、Playwright、GUI Chrome 共同受益）。
    shm_size: "2gb"
    volumes:
      # === 工作区 ===
      - ./workspace:/workspace:rshared
      
      # 主服务
      # === Git 配置 ===
      - ./app-config/.git-credentials:/home/app/.git-credentials:rshared
      - ./app-config/.gitconfig:/home/app/.gitconfig:rshared
      - ./.config/gh:/home/app/.config/gh:rshared
      # === Code-Server ===
      - ./.local/share/code-server:/home/app/.local/share/code-server:rshared
      - ./.config/code-server:/home/app/.config/code-server:rshared
      # === SSH ===
      - ./app-config/authorized_keys:/home/app/.ssh/authorized_keys:ro # SSH 公钥文件，挂载后启用 SSH Server，端口 2223
      
      # CLI
      # === OpenCode 配置 ===
      - ./.config/opencode/agents:/home/app/.config/opencode/agents:rshared
      - ./.config/opencode/plugins:/home/app/.config/opencode/plugins:rshared
      - ./.config/opencode/skills:/home/app/.config/opencode/skills:rshared
      - ./.config/opencode/AGENTS.md:/home/app/.config/opencode/AGENTS.md:rshared
      - ./.config/opencode/opencode.json:/home/app/.config/opencode/opencode.json:rshared
      - ./.local/share/opencode:/home/app/.local/share/opencode:rshared
      # === OpenCode 附属依赖 - Serena ===
      - ./.serena:/home/app/.serena:rshared
      # === Anthropic Claude Code ===
      - ./.claude:/home/app/.claude:rshared
      # === OpenAI Codex ===
      - ./.codex:/home/app/.codex:rshared
      # === 飞书CLI ===
      - ./.lark-cli:/home/app/.lark-cli:rshared
      - ./.local/share/lark-cli:/home/app/.local/share/lark-cli:rshared

      # 其他
      # === WRAP代理 ===
      - warp-data:/etc/wireguard

    networks:
      - 1panel-network
    restart: unless-stopped
    # 日志轮换限制（吸收自上游 MicroWARP fafc131）：保留 3 个历史文件，每个最大 3MB，
    # 防止 WARP 探测/服务日志长期运行撑爆宿主磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "3m"
        max-file: "3"

volumes:
  warp-data:

networks:
  1panel-network:
    external: true
