[package]
name = "opencode-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
axum = "0.7"
base64 = "0.22"
json5 = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "net"] }
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }

[profile.release]
opt-level = "s"
strip = "symbols"
lto = "thin"
