name: Check OpenCode Updates

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Get OpenCode latest release
        id: upstream
        run: |
          LATEST=$(curl -s https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r '.tag_name')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "OpenCode latest: $LATEST"

      - name: Get our latest release
        id: local
        run: |
          LOCAL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name // empty')
          echo "version=$LOCAL" >> $GITHUB_OUTPUT
          if [ -n "$LOCAL" ]; then
            echo "Our latest: $LOCAL"
          else
            echo "No existing release found"
          fi

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.local.outputs.version }}" = "${{ steps.upstream.outputs.version }}" ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date: ${{ steps.upstream.outputs.version }}"
          else
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "New version available: ${{ steps.upstream.outputs.version }}"
          fi

      - name: Trigger build
        if: steps.compare.outputs.has_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-build.yml',
              ref: 'main'
            });
