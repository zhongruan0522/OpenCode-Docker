name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker/**'
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'OpenCode version (e.g. 1.3.15 or v1.3.15). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      code_server_version:
        description: 'code-server version (e.g. 4.115.0 or v4.115.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      codex_version:
        description: 'Codex CLI version (e.g. 0.122.0, v0.122.0, or rust-v0.122.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      serena_version:
        description: 'serena-agent version (e.g. 0.1.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      open_design_version:
        description: 'Open Design version (e.g. 0.9.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      claude_code_version:
        description: 'Claude Code version (e.g. 1.0.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve versions
        id: version
        env:
          INPUT_OPENCODE_VERSION: ${{ inputs.opencode_version }}
          INPUT_CODE_SERVER_VERSION: ${{ inputs.code_server_version }}
          INPUT_CODEX_VERSION: ${{ inputs.codex_version }}
          INPUT_SERENA_VERSION: ${{ inputs.serena_version }}
          INPUT_OPEN_DESIGN_VERSION: ${{ inputs.open_design_version }}
          INPUT_CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
        run: |
          if [ -z "$INPUT_OPENCODE_VERSION" ] || [ -z "$INPUT_CODE_SERVER_VERSION" ] || [ -z "$INPUT_CODEX_VERSION" ] || [ -z "$INPUT_SERENA_VERSION" ] || [ -z "$INPUT_OPEN_DESIGN_VERSION" ] || [ -z "$INPUT_CLAUDE_CODE_VERSION" ]; then
            BODY=$(curl -fsSL https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.body // empty')
            SAVED_OPENCODE_VERSION=$(echo "$BODY" | grep -oP 'opencode-version=\K[^\s]+' || true)
            SAVED_CODE_SERVER_VERSION=$(echo "$BODY" | grep -oP 'code-server-version=\K[^\s]+' || true)
            SAVED_CODEX_VERSION=$(echo "$BODY" | grep -oP 'codex-version=\K[^\s]+' || true)
            SAVED_SERENA_VERSION=$(echo "$BODY" | grep -oP 'serena-version=\K[^\s]+' || true)
            SAVED_OPEN_DESIGN_VERSION=$(echo "$BODY" | grep -oP 'open-design-version=\K[^\s]+' || true)
            SAVED_CLAUDE_CODE_VERSION=$(echo "$BODY" | grep -oP 'claude-code-version=\K[^\s]+' || true)
          fi

          # --- OpenCode 版本 ---
          if [ -n "$INPUT_OPENCODE_VERSION" ]; then
            OC_VERSION="$INPUT_OPENCODE_VERSION"
            OC_VERSION="${OC_VERSION#v}"
            OC_TAG="v${OC_VERSION}"
          else
            if [ -z "$SAVED_OPENCODE_VERSION" ]; then
              echo "OpenCode version was not provided and no saved release version was found" >&2
              exit 1
            fi
            OC_TAG="$SAVED_OPENCODE_VERSION"
            OC_VERSION="${OC_TAG#v}"
          fi
          echo "OpenCode: $OC_TAG"

          # --- code-server 版本 ---
          if [ -n "$INPUT_CODE_SERVER_VERSION" ]; then
            CS_VERSION="$INPUT_CODE_SERVER_VERSION"
            CS_VERSION="${CS_VERSION#v}"
          else
            if [ -z "$SAVED_CODE_SERVER_VERSION" ]; then
              echo "code-server version was not provided and no saved release version was found" >&2
              exit 1
            fi
            CS_VERSION="$SAVED_CODE_SERVER_VERSION"
            CS_VERSION="${CS_VERSION#v}"
          fi
          echo "code-server: $CS_VERSION"

          # --- Codex 版本 ---
          if [ -n "$INPUT_CODEX_VERSION" ]; then
            CODEX_VERSION="$INPUT_CODEX_VERSION"
            CODEX_VERSION="${CODEX_VERSION#rust-v}"
            CODEX_VERSION="${CODEX_VERSION#v}"
          else
            if [ -z "$SAVED_CODEX_VERSION" ]; then
              echo "Codex version was not provided and no saved release version was found" >&2
              exit 1
            fi
            CODEX_VERSION="$SAVED_CODEX_VERSION"
            CODEX_VERSION="${CODEX_VERSION#rust-v}"
            CODEX_VERSION="${CODEX_VERSION#v}"
          fi
          echo "Codex: $CODEX_VERSION"

          # --- serena-agent 版本 ---
          if [ -n "$INPUT_SERENA_VERSION" ]; then
            SERENA_VERSION="$INPUT_SERENA_VERSION"
          else
            if [ -z "$SAVED_SERENA_VERSION" ]; then
              echo "serena-agent version was not provided and no saved release version was found" >&2
              exit 1
            fi
            SERENA_VERSION="$SAVED_SERENA_VERSION"
          fi
          echo "serena-agent: $SERENA_VERSION"

          # --- Open Design 版本 ---
          if [ -n "$INPUT_OPEN_DESIGN_VERSION" ]; then
            OD_VERSION="$INPUT_OPEN_DESIGN_VERSION"
            OD_VERSION="${OD_VERSION#open-design-v}"
            OD_VERSION="${OD_VERSION#v}"
          else
            if [ -n "$SAVED_OPEN_DESIGN_VERSION" ]; then
              OD_VERSION="$SAVED_OPEN_DESIGN_VERSION"
              OD_VERSION="${OD_VERSION#open-design-v}"
              OD_VERSION="${OD_VERSION#v}"
            else
              # 首次集成时无历史记录，使用 Dockerfile 中的默认版本
              OD_VERSION="0.9.0"
              echo "Open Design: no saved version found, using default ${OD_VERSION}"
            fi
          fi
          echo "Open Design: $OD_VERSION"

          # --- Claude Code 版本 ---
          if [ -n "$INPUT_CLAUDE_CODE_VERSION" ]; then
            CC_VERSION="$INPUT_CLAUDE_CODE_VERSION"
            CC_VERSION="${CC_VERSION#v}"
          else
            if [ -z "$SAVED_CLAUDE_CODE_VERSION" ]; then
              echo "Claude Code version was not provided and no saved release version was found" >&2
              exit 1
            fi
            CC_VERSION="$SAVED_CLAUDE_CODE_VERSION"
            CC_VERSION="${CC_VERSION#v}"
          fi
          echo "Claude Code: $CC_VERSION"

          echo "oc_tag=$OC_TAG" >> $GITHUB_OUTPUT
          echo "oc_version=$OC_VERSION" >> $GITHUB_OUTPUT
          echo "cs_version=$CS_VERSION" >> $GITHUB_OUTPUT
          echo "codex_version=$CODEX_VERSION" >> $GITHUB_OUTPUT
          echo "serena_version=$SERENA_VERSION" >> $GITHUB_OUTPUT
          echo "od_version=$OD_VERSION" >> $GITHUB_OUTPUT
          echo "cc_version=$CC_VERSION" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check_release
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.oc_tag }})
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.oc_tag }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.oc_tag }}
          name: OpenCode ${{ steps.version.outputs.oc_tag }}
          body: |
            Docker image for [OpenCode ${{ steps.version.outputs.oc_tag }}](https://github.com/anomalyco/opencode/releases/tag/${{ steps.version.outputs.oc_tag }})

            <!-- 版本标记（供自动更新检查读取，请勿删除） -->
            <!-- opencode-version=${{ steps.version.outputs.oc_tag }} -->
            <!-- code-server-version=${{ steps.version.outputs.cs_version }} -->
            <!-- codex-version=${{ steps.version.outputs.codex_version }} -->
            <!-- serena-version=${{ steps.version.outputs.serena_version }} -->
            <!-- open-design-version=${{ steps.version.outputs.od_version }} -->
            <!-- claude-code-version=${{ steps.version.outputs.cc_version }} -->
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.oc_tag }},enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            OPENCODE_VERSION=${{ steps.version.outputs.oc_version }}
            CODE_SERVER_VERSION=${{ steps.version.outputs.cs_version }}
            CODEX_VERSION=${{ steps.version.outputs.codex_version }}
            SERENA_VERSION=${{ steps.version.outputs.serena_version }}
            OPEN_DESIGN_VERSION=${{ steps.version.outputs.od_version }}
            CLAUDE_CODE_VERSION=${{ steps.version.outputs.cc_version }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
