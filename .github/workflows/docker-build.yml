name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'agent/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'agent/**'
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'OpenCode version (e.g. 1.3.15 or v1.3.15). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      code_server_version:
        description: 'code-server version (e.g. 4.115.0 or v4.115.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      codex_version:
        description: 'Codex CLI version (e.g. 0.122.0, v0.122.0, or rust-v0.122.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      serena_version:
        description: 'serena-agent version (e.g. 0.1.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      claude_code_version:
        description: 'Claude Code version (e.g. 2.1.220 or v2.1.220). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      codex_security_version:
        description: 'codex-security version (e.g. 0.1.12). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    # 跨层同 push 竞态保护：若本次 push 同时改动了 Base/桌面层归属文件，
    # 则跳过本 workflow 的 push 直接触发，由底层构建完成后的级联按序重建，
    # 避免 FROM :desktop 时下层镜像尚未推送而报 not found。
    # workflow_dispatch（含级联派发）不走此判断：派发时下层镜像必已推送。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if lower layers changed in this push
        id: check
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # push 事件必带 before（分支前一 tip）；为零值/不可达时 diff 直接报错，不做兜底
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "Files changed in this push:"
          echo "$CHANGED"
          # Base 层 + 桌面层归属路径（上层镜像 FROM 它们，同 push 变动即存在竞态）
          LOWER_RE='^(Dockerfile\.base|base/|Dockerfile\.desktop|desktop/)'
          if grep -qE "$LOWER_RE"; then
            echo "Lower-layer files changed in same push; skip direct trigger, cascade will rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Non-push events never skip
        if: github.event_name != 'push'
        run: echo "skip=false" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve versions
        id: version
        env:
          INPUT_OPENCODE_VERSION: ${{ inputs.opencode_version }}
          INPUT_CODE_SERVER_VERSION: ${{ inputs.code_server_version }}
          INPUT_CODEX_VERSION: ${{ inputs.codex_version }}
          INPUT_SERENA_VERSION: ${{ inputs.serena_version }}
          INPUT_CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          INPUT_CODEX_SECURITY_VERSION: ${{ inputs.codex_security_version }}
        run: |
          set -euo pipefail

          # --- 版本解析统一框架 ---
          # 各组件的 tag 前缀剥离规则不同（GitHub tag 格式差异），统一收敛到一处声明：
          #   <组件名>|<输入变量名>|<release 标记名>|<tag 专属前缀(可空)>
          # 剥离规则统一为：先剥组件专属前缀（rust-v / npm-v 等），再剥裸 v 前缀。
          # 输出统一命名：<组件名>_version（纯版本号）；opencode 额外输出 opencode_tag 用作 release tag。
          COMPONENTS=(
            "opencode|INPUT_OPENCODE_VERSION|opencode-version|"
            "code_server|INPUT_CODE_SERVER_VERSION|code-server-version|"
            "codex|INPUT_CODEX_VERSION|codex-version|rust-v"
            "serena|INPUT_SERENA_VERSION|serena-version|"
            "claude_code|INPUT_CLAUDE_CODE_VERSION|claude-code-version|"
            "codex_security|INPUT_CODEX_SECURITY_VERSION|codex-security-version|npm-v"
          )

          # 任一组件未提供输入时，从 latest release body 提取全部锁定版本
          NEED_SAVED=0
          for comp in "${COMPONENTS[@]}"; do
            IFS='|' read -r _ in_var _rest <<<"$comp"
            if [ -z "${!in_var:-}" ]; then NEED_SAVED=1; break; fi
          done
          if [ "$NEED_SAVED" -eq 1 ]; then
            BODY=$(curl -fsSL https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.body // empty')
          fi

          OC_VERSION=""
          for comp in "${COMPONENTS[@]}"; do
            IFS='|' read -r name in_var mark custom_prefix <<<"$comp"

            ver="${!in_var:-}"
            if [ -z "$ver" ]; then
              ver=$(printf '%s' "${BODY:-}" | grep -oP "${mark}=\K[^\s]+" || true)
              if [ -z "$ver" ]; then
                echo "$name version was not provided and no saved release version was found" >&2
                exit 1
              fi
            fi

            # 统一剥离：组件专属前缀 → 裸 v 前缀（幂等，无前缀时为空操作）
            if [ -n "$custom_prefix" ]; then ver="${ver#"$custom_prefix"}"; fi
            ver="${ver#v}"

            echo "$name: $ver"
            echo "${name}_version=$ver" >> "$GITHUB_OUTPUT"
            if [ "$name" = "opencode" ]; then OC_VERSION="$ver"; fi
          done

          # --- Antigravity CLI 版本 ---
          # 上游清单永远只暴露最新版（无历史版本可锁），因此不设 workflow_dispatch 入参、
          # 也不读 release 锁定值，每次构建实时查清单：取到的版本既写入 release 标记，
          # 也作为 ARG 传给 Dockerfile 充当缓存 key（agy 升级时使其安装层失效重建）。
          ANTIGRAVITY_VERSION=$(curl -fsSL --retry 10 --retry-all-errors --retry-delay 2 \
            https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json | jq -r '.version')
          if [ -z "$ANTIGRAVITY_VERSION" ] || [ "$ANTIGRAVITY_VERSION" = "null" ]; then
            echo "Antigravity CLI version was not resolved from upstream manifest" >&2
            exit 1
          fi
          echo "Antigravity CLI: $ANTIGRAVITY_VERSION"
          echo "antigravity_version=$ANTIGRAVITY_VERSION" >> $GITHUB_OUTPUT
          # release tag：OpenCode 的 v 前缀 tag（供 check_release 与 release 创建复用）
          echo "opencode_tag=v${OC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check_release
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.opencode_tag }})
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.opencode_tag }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.opencode_tag }}
          name: OpenCode ${{ steps.version.outputs.opencode_tag }}
          body: |
            Docker image for [OpenCode ${{ steps.version.outputs.opencode_tag }}](https://github.com/anomalyco/opencode/releases/tag/${{ steps.version.outputs.opencode_tag }})

            <!-- 版本标记（供自动更新检查读取，请勿删除） -->
            <!-- opencode-version=${{ steps.version.outputs.opencode_tag }} -->
            <!-- code-server-version=${{ steps.version.outputs.code_server_version }} -->
            <!-- codex-version=${{ steps.version.outputs.codex_version }} -->
            <!-- serena-version=${{ steps.version.outputs.serena_version }} -->
            <!-- claude-code-version=${{ steps.version.outputs.claude_code_version }} -->
            <!-- codex-security-version=${{ steps.version.outputs.codex_security_version }} -->
            <!-- antigravity-version=${{ steps.version.outputs.antigravity_version }} -->
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.opencode_tag }},enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            OPENCODE_VERSION=${{ steps.version.outputs.opencode_version }}
            CODE_SERVER_VERSION=${{ steps.version.outputs.code_server_version }}
            CODEX_VERSION=${{ steps.version.outputs.codex_version }}
            SERENA_VERSION=${{ steps.version.outputs.serena_version }}
            CLAUDE_CODE_VERSION=${{ steps.version.outputs.claude_code_version }}
            CODEX_SECURITY_VERSION=${{ steps.version.outputs.codex_security_version }}
            ANTIGRAVITY_VERSION=${{ steps.version.outputs.antigravity_version }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
