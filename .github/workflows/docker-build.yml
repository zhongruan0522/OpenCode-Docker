name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'agent/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'agent/**'
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'OpenCode version (e.g. 1.3.15 or v1.3.15). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      code_server_version:
        description: 'code-server version (e.g. 4.115.0 or v4.115.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      codex_version:
        description: 'Codex CLI version (e.g. 0.122.0, v0.122.0, or rust-v0.122.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      serena_version:
        description: 'serena-agent version (e.g. 0.1.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      claude_code_version:
        description: 'Claude Code version (e.g. 2.1.220 or v2.1.220). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      codex_security_version:
        description: 'codex-security version (e.g. 0.1.12). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    # 跨层同 push 竞态保护：若本次 push 同时改动了 Base/桌面层归属文件，
    # 则跳过本 workflow 的 push 直接触发，由底层构建完成后的级联按序重建，
    # 避免 FROM :desktop 时下层镜像尚未推送而报 not found。
    # workflow_dispatch（含级联派发）不走此判断：派发时下层镜像必已推送。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if lower layers changed in this push
        id: check
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # push 事件必带 before（分支前一 tip）；为零值/不可达时 diff 直接报错，不做兜底
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "Files changed in this push:"
          echo "$CHANGED"
          # Base 层 + 桌面层归属路径（上层镜像 FROM 它们，同 push 变动即存在竞态）
          LOWER_RE='^(Dockerfile\.base|base/|docker/(entrypoint\.sh|healthcheck\.sh|supervisord\.conf|init-warp\.sh)|Dockerfile\.desktop|desktop/|docker/(init-desktop\.sh|xrdp-startwm\.sh))'
          if grep -qE "$LOWER_RE"; then
            echo "Lower-layer files changed in same push; skip direct trigger, cascade will rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Non-push events never skip
        if: github.event_name != 'push'
        run: echo "skip=false" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve versions
        id: version
        env:
          INPUT_OPENCODE_VERSION: ${{ inputs.opencode_version }}
          INPUT_CODE_SERVER_VERSION: ${{ inputs.code_server_version }}
          INPUT_CODEX_VERSION: ${{ inputs.codex_version }}
          INPUT_SERENA_VERSION: ${{ inputs.serena_version }}
          INPUT_CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          INPUT_CODEX_SECURITY_VERSION: ${{ inputs.codex_security_version }}
        run: |
          if [ -z "$INPUT_OPENCODE_VERSION" ] || [ -z "$INPUT_CODE_SERVER_VERSION" ] || [ -z "$INPUT_CODEX_VERSION" ] || [ -z "$INPUT_SERENA_VERSION" ] || [ -z "$INPUT_CLAUDE_CODE_VERSION" ] || [ -z "$INPUT_CODEX_SECURITY_VERSION" ]; then
            BODY=$(curl -fsSL https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.body // empty')
            SAVED_OPENCODE_VERSION=$(echo "$BODY" | grep -oP 'opencode-version=\K[^\s]+' || true)
            SAVED_CODE_SERVER_VERSION=$(echo "$BODY" | grep -oP 'code-server-version=\K[^\s]+' || true)
            SAVED_CODEX_VERSION=$(echo "$BODY" | grep -oP 'codex-version=\K[^\s]+' || true)
            SAVED_SERENA_VERSION=$(echo "$BODY" | grep -oP 'serena-version=\K[^\s]+' || true)
            SAVED_CLAUDE_CODE_VERSION=$(echo "$BODY" | grep -oP 'claude-code-version=\K[^\s]+' || true)
            SAVED_CODEX_SECURITY_VERSION=$(echo "$BODY" | grep -oP 'codex-security-version=\K[^\s]+' || true)
          fi

          # --- OpenCode 版本 ---
          if [ -n "$INPUT_OPENCODE_VERSION" ]; then
            OC_VERSION="$INPUT_OPENCODE_VERSION"
            OC_VERSION="${OC_VERSION#v}"
            OC_TAG="v${OC_VERSION}"
          else
            if [ -z "$SAVED_OPENCODE_VERSION" ]; then
              echo "OpenCode version was not provided and no saved release version was found" >&2
              exit 1
            fi
            OC_TAG="$SAVED_OPENCODE_VERSION"
            OC_VERSION="${OC_TAG#v}"
          fi
          echo "OpenCode: $OC_TAG"

          # --- code-server 版本 ---
          if [ -n "$INPUT_CODE_SERVER_VERSION" ]; then
            CS_VERSION="$INPUT_CODE_SERVER_VERSION"
            CS_VERSION="${CS_VERSION#v}"
          else
            if [ -z "$SAVED_CODE_SERVER_VERSION" ]; then
              echo "code-server version was not provided and no saved release version was found" >&2
              exit 1
            fi
            CS_VERSION="$SAVED_CODE_SERVER_VERSION"
            CS_VERSION="${CS_VERSION#v}"
          fi
          echo "code-server: $CS_VERSION"

          # --- Codex 版本 ---
          if [ -n "$INPUT_CODEX_VERSION" ]; then
            CODEX_VERSION="$INPUT_CODEX_VERSION"
            CODEX_VERSION="${CODEX_VERSION#rust-v}"
            CODEX_VERSION="${CODEX_VERSION#v}"
          else
            if [ -z "$SAVED_CODEX_VERSION" ]; then
              echo "Codex version was not provided and no saved release version was found" >&2
              exit 1
            fi
            CODEX_VERSION="$SAVED_CODEX_VERSION"
            CODEX_VERSION="${CODEX_VERSION#rust-v}"
            CODEX_VERSION="${CODEX_VERSION#v}"
          fi
          echo "Codex: $CODEX_VERSION"

          # --- serena-agent 版本 ---
          if [ -n "$INPUT_SERENA_VERSION" ]; then
            SERENA_VERSION="$INPUT_SERENA_VERSION"
          else
            if [ -z "$SAVED_SERENA_VERSION" ]; then
              echo "serena-agent version was not provided and no saved release version was found" >&2
              exit 1
            fi
            SERENA_VERSION="$SAVED_SERENA_VERSION"
          fi
          echo "serena-agent: $SERENA_VERSION"

          # --- Claude Code 版本 ---
          if [ -n "$INPUT_CLAUDE_CODE_VERSION" ]; then
            CC_VERSION="$INPUT_CLAUDE_CODE_VERSION"
            CC_VERSION="${CC_VERSION#v}"
          else
            if [ -z "$SAVED_CLAUDE_CODE_VERSION" ]; then
              echo "Claude Code version was not provided and no saved release version was found" >&2
              exit 1
            fi
            CC_VERSION="$SAVED_CLAUDE_CODE_VERSION"
            CC_VERSION="${CC_VERSION#v}"
          fi
          echo "Claude Code: $CC_VERSION"

          # --- codex-security 版本 ---
          if [ -n "$INPUT_CODEX_SECURITY_VERSION" ]; then
            CXS_VERSION="$INPUT_CODEX_SECURITY_VERSION"
            CXS_VERSION="${CXS_VERSION#npm-v}"
            CXS_VERSION="${CXS_VERSION#v}"
          else
            if [ -z "$SAVED_CODEX_SECURITY_VERSION" ]; then
              echo "codex-security version was not provided and no saved release version was found" >&2
              exit 1
            fi
            CXS_VERSION="$SAVED_CODEX_SECURITY_VERSION"
            CXS_VERSION="${CXS_VERSION#npm-v}"
            CXS_VERSION="${CXS_VERSION#v}"
          fi
          echo "codex-security: $CXS_VERSION"

          echo "oc_tag=$OC_TAG" >> $GITHUB_OUTPUT
          echo "oc_version=$OC_VERSION" >> $GITHUB_OUTPUT
          echo "cs_version=$CS_VERSION" >> $GITHUB_OUTPUT
          echo "codex_version=$CODEX_VERSION" >> $GITHUB_OUTPUT
          echo "serena_version=$SERENA_VERSION" >> $GITHUB_OUTPUT
          echo "cc_version=$CC_VERSION" >> $GITHUB_OUTPUT
          echo "cxs_version=$CXS_VERSION" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check_release
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.oc_tag }})
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.oc_tag }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.oc_tag }}
          name: OpenCode ${{ steps.version.outputs.oc_tag }}
          body: |
            Docker image for [OpenCode ${{ steps.version.outputs.oc_tag }}](https://github.com/anomalyco/opencode/releases/tag/${{ steps.version.outputs.oc_tag }})

            <!-- 版本标记（供自动更新检查读取，请勿删除） -->
            <!-- opencode-version=${{ steps.version.outputs.oc_tag }} -->
            <!-- code-server-version=${{ steps.version.outputs.cs_version }} -->
            <!-- codex-version=${{ steps.version.outputs.codex_version }} -->
            <!-- serena-version=${{ steps.version.outputs.serena_version }} -->
            <!-- claude-code-version=${{ steps.version.outputs.cc_version }} -->
            <!-- codex-security-version=${{ steps.version.outputs.cxs_version }} -->
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.oc_tag }},enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            OPENCODE_VERSION=${{ steps.version.outputs.oc_version }}
            CODE_SERVER_VERSION=${{ steps.version.outputs.cs_version }}
            CODEX_VERSION=${{ steps.version.outputs.codex_version }}
            SERENA_VERSION=${{ steps.version.outputs.serena_version }}
            CLAUDE_CODE_VERSION=${{ steps.version.outputs.cc_version }}
            CODEX_SECURITY_VERSION=${{ steps.version.outputs.cxs_version }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
