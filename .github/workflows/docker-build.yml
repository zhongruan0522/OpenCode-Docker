name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'Dockerfile.base'
      - 'docker/**'
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'OpenCode version (e.g. v1.3.15). Leave empty for latest.'
        required: false
        default: ''
        type: string
      code_server_version:
        description: 'code-server version (e.g. 4.115.0). Leave empty for latest.'
        required: false
        default: ''
        type: string
      codex_version:
        description: 'Codex CLI version (e.g. 0.122.0). Leave empty for latest.'
        required: false
        default: ''
        type: string
      serena_version:
        description: 'serena-agent version (e.g. 0.1.0). Leave empty for latest.'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve versions
        id: version
        run: |
          # --- OpenCode 版本 ---
          if [ -n "${{ inputs.opencode_version }}" ]; then
            OC_VERSION="${{ inputs.opencode_version }}"
            OC_VERSION="${OC_VERSION#v}"
            OC_TAG="v${OC_VERSION}"
          else
            OC_TAG=$(curl -s https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r '.tag_name')
            OC_VERSION="${OC_TAG#v}"
          fi
          echo "OpenCode: $OC_TAG"

          # --- code-server 版本 ---
          if [ -n "${{ inputs.code_server_version }}" ]; then
            CS_VERSION="${{ inputs.code_server_version }}"
            CS_VERSION="${CS_VERSION#v}"
          else
            CS_VERSION=$(curl -s https://api.github.com/repos/coder/code-server/releases/latest | jq -r '.tag_name')
            CS_VERSION="${CS_VERSION#v}"
          fi
          echo "code-server: $CS_VERSION"

          # --- Codex 版本 ---
          if [ -n "${{ inputs.codex_version }}" ]; then
            CODEX_VERSION="${{ inputs.codex_version }}"
            CODEX_VERSION="${CODEX_VERSION#rust-v}"
            CODEX_VERSION="${CODEX_VERSION#v}"
          else
            CODEX_TAG=$(curl -s https://api.github.com/repos/openai/codex/releases/latest | jq -r '.tag_name')
            CODEX_VERSION="${CODEX_TAG#rust-v}"
          fi
          echo "Codex: $CODEX_VERSION"

          # --- serena-agent 版本 ---
          if [ -n "${{ inputs.serena_version }}" ]; then
            SERENA_VERSION="${{ inputs.serena_version }}"
          else
            SERENA_VERSION=$(curl -s https://pypi.org/pypi/serena-agent/json | jq -r '.info.version')
          fi
          echo "serena-agent: $SERENA_VERSION"

          echo "oc_tag=$OC_TAG" >> $GITHUB_OUTPUT
          echo "oc_version=$OC_VERSION" >> $GITHUB_OUTPUT
          echo "cs_version=$CS_VERSION" >> $GITHUB_OUTPUT
          echo "codex_version=$CODEX_VERSION" >> $GITHUB_OUTPUT
          echo "serena_version=$SERENA_VERSION" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check_release
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.oc_tag }})
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.oc_tag }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.oc_tag }}
          name: OpenCode ${{ steps.version.outputs.oc_tag }}
          body: |
            Docker image for [OpenCode ${{ steps.version.outputs.oc_tag }}](https://github.com/anomalyco/opencode/releases/tag/${{ steps.version.outputs.oc_tag }})

            <!-- 版本标记（供自动更新检查读取，请勿删除） -->
            <!-- opencode-version=${{ steps.version.outputs.oc_tag }} -->
            <!-- code-server-version=${{ steps.version.outputs.cs_version }} -->
            <!-- codex-version=${{ steps.version.outputs.codex_version }} -->
            <!-- serena-version=${{ steps.version.outputs.serena_version }} -->
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.oc_tag }},enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            OPENCODE_VERSION=${{ steps.version.outputs.oc_version }}
            CODE_SERVER_VERSION=${{ steps.version.outputs.cs_version }}
            CODEX_VERSION=${{ steps.version.outputs.codex_version }}
            SERENA_VERSION=${{ steps.version.outputs.serena_version }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
