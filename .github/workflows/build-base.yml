name: Build Base Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.base'
      - 'base/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile.base'
      - 'base/**'
  schedule:
    # 每周一北京时间 04:00 (UTC 周日 20:00)
    - cron: '0 20 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercased image name
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}"
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image }}:base
          # 下游层通过 FROM :base 直接获得远程镜像层；这里不再用每个 workflow
          # 独立的 GHA cache scope 反复导出相同大层。生产路径统一使用共享的
          # registry cache 标签，且仅缓存最终链路（mode=min）。
          cache-from: "${{
            github.event_name != 'pull_request' &&
            format('type=registry,ref={0}:buildcache-base', steps.meta.outputs.image) ||
            'type=gha'
            }}"
          cache-to: "${{
            github.event_name != 'pull_request' &&
            format('type=registry,ref={0}:buildcache-base,mode=min', steps.meta.outputs.image) ||
            'type=gha,mode=min'
            }}"

  trigger-desktop:
    if: github.event_name != 'pull_request'
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Generate GitHub App token
        # 用 GitHub App installation token 而非默认 GITHUB_TOKEN 派发 workflow_dispatch。
        # 由 GITHUB_TOKEN 派发的 run，其完成时派发的 workflow_run 事件会被 GHA 防递归机制抑制，
        # 导致 notify.yml 收不到下游构建完成通知；改用 App token 可正常派发事件。
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # 仅授权派发 workflow_dispatch 所需的最小权限
          permission-actions: write

      - name: Trigger desktop layer build
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-desktop.yml',
              ref: 'main'
            });
