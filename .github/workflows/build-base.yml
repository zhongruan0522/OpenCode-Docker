name: Build Base Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.base'
      - 'docker/**'
  schedule:
    # 每周一北京时间 04:00 (UTC 周日 20:00)
    - cron: '0 20 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercased image name
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}"
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:base
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-dynamic:
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Trigger dynamic layer build
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-build.yml',
              ref: 'main'
            });
