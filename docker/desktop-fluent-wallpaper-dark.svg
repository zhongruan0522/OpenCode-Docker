<?xml version="1.0" encoding="UTF-8"?>
<!-- Fluent 风格深色壁纸（暗色变体）
     与 desktop-fluent-wallpaper.svg 同源风格，但背景更深，适合 Dark 主题。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="50%" stop-color="#0d1729"/>
      <stop offset="100%" stop-color="#102a4d"/>
    </linearGradient>
    <linearGradient id="ribbon1-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#198ee6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#36c5f0" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ribbon2-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0067c0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#198ee6" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow-dark" cx="0.7" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#36c5f0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#36c5f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg-dark)"/>
  <rect width="1920" height="1080" fill="url(#glow-dark)"/>
  <path d="M -200 750 Q 480 500 960 600 T 2120 450 L 2120 1080 L -200 1080 Z"
        fill="url(#ribbon1-dark)"/>
  <path d="M -200 900 Q 400 700 960 800 T 2120 700 L 2120 1080 L -200 1080 Z"
        fill="url(#ribbon2-dark)"/>
  <g transform="translate(960 540)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="380" ry="380" fill="#198ee6" opacity="0.1"/>
    <ellipse cx="0" cy="0" rx="220" ry="220" fill="#36c5f0" opacity="0.14"/>
    <path d="M 0 -180 Q 120 -60 0 180 Q -120 60 0 -180 Z" fill="#9fd8ff" opacity="0.28"/>
    <path d="M 0 -180 Q -120 -60 0 180 Q 120 60 0 -180 Z" fill="#198ee6" opacity="0.35"/>
  </g>
</svg>
