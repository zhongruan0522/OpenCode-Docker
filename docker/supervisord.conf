; 用 supervisord 同时托管 OpenCode 和 code-server，避免同容器多进程无人看护。
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; OpenCode 继续保持原来的服务入口，对外提供 4096 端口。
[program:opencode]
command=/usr/local/bin/opencode serve --hostname 0.0.0.0
directory=/workspace
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/home/app",USER="app",SHELL="/bin/bash"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; code-server 绑定容器内 8080，通过 compose 的宿主端口或反向代理暴露。
[program:code-server]
command=/usr/bin/code-server --bind-addr 0.0.0.0:8080 --auth password --disable-telemetry /workspace
directory=/workspace
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/home/app",USER="app",SHELL="/bin/bash"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
