; 用 supervisord 同时托管 OpenCode 和 code-server，避免同容器多进程无人看护。
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; 暴露 HTTP 端点供 Docker HEALTHCHECK 使用。
[inet_http_server]
port=127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=http://127.0.0.1:9001

; Docker daemon（DinD 模式，数据存内存，容器重启即复原）
; 默认不自启以节省内存（~200-500 MB），通过 ENABLE_DOCKERD=1 开启开机自启，
; 或运行中手动 supervisorctl start dockerd 拉起。
[program:dockerd]
command=/usr/bin/dockerd --data-root=/tmp/docker --storage-driver=vfs --iptables=false --bridge=none
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; OpenCode 继续保持原来的服务入口，对外提供 4096 端口。
[program:opencode]
command=/usr/local/bin/opencode serve --hostname 0.0.0.0 --port 4096
directory=/workspace
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/home/app",USER="app",SHELL="/bin/bash"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; code-server 绑定容器内 8080，通过 compose 的宿主端口或反向代理暴露。
[program:code-server]
command=/usr/bin/code-server --bind-addr 0.0.0.0:8080 --auth password --disable-telemetry /workspace
directory=/workspace
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/home/app",USER="app",SHELL="/bin/bash"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Open Design daemon，提供 Web UI 和设计工具 API，端口 4098。
; 默认不启动，由 entrypoint.sh 注入 OD_API_TOKEN 后改为自启。
; 注意：supervisord 的 environment= 不会继承容器环境变量，
; 因此 OD_API_TOKEN 必须由 entrypoint 显式写入本行，否则 daemon
; 检测到 OD_BIND_HOST=0.0.0.0 却无 token 会拒绝启动并陷入 autorestart 循环。
[program:open-design]
command=node apps/daemon/dist/cli.js --no-open
directory=/opt/open-design
autostart=false
autorestart=true
startsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/home/app",USER="app",SHELL="/bin/bash",NODE_ENV="production",NODE_OPTIONS="--max-old-space-size=384",OD_BIND_HOST="0.0.0.0",OD_PORT="4098",OD_DATA_DIR="/opt/open-design/.od"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

