; 用 supervisord 同时托管 OpenChamber 和 code-server，避免同容器多进程无人看护。
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; 暴露 HTTP 端点供 Docker HEALTHCHECK 使用。
[inet_http_server]
port=127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=http://127.0.0.1:9001

; Docker daemon（DinD 模式，数据存内存，容器重启即复原）
; 默认不自启以节省内存（~200-500 MB），通过 ENABLE_DOCKERD=1 开启开机自启，
; 或运行中手动 supervisorctl start dockerd 拉起。
[program:dockerd]
command=/usr/bin/dockerd --data-root=/tmp/docker --storage-driver=vfs --iptables=false --bridge=none
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; OpenChamber 是容器的主服务入口：Web UI + 托管 opencode serve 子进程，对外提供 4096 端口。
; --foreground 前台运行（配合 supervisord 托管）；监听地址由 OPENCHAMBER_HOST 控制（entrypoint 默认 0.0.0.0）。
[program:openchamber]
command=/usr/local/bin/openchamber serve --port 4096 --foreground
directory=/workspace
user=app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/home/app",USER="app",SHELL="/bin/bash",OPENCHAMBER_HOST="%(ENV_OPENCHAMBER_HOST)s",OPENCHAMBER_UI_PASSWORD="%(ENV_OPENCHAMBER_UI_PASSWORD)s"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; code-server 绑定容器内 8080，通过 compose 的宿主端口或反向代理暴露。
[program:code-server]
command=/usr/bin/code-server --bind-addr 0.0.0.0:8080 --auth password --disable-telemetry /workspace
directory=/workspace
user=app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/home/app",USER="app",SHELL="/bin/bash"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
